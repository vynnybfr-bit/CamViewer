plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.cameraviewer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.cameraviewer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

// Download the original image files during the build without redrawing or altering them.
def downloadAssets = tasks.register('downloadAssets') {
    doLast {
        def drawableDir = file("$projectDir/src/main/res/drawable")
        drawableDir.mkdirs()

        def assets = [
            'ic_camviewer.jpg': 'https://cdn.creativefabrica.com/2021/08/05/Security-camera-icon-Graphics-15525544-1-1-580x386.jpg',
            'botafogo_watermark.png': 'https://upload.wikimedia.org/wikipedia/commons/c/cb/Escudo_Botafogo.png'
        ]

        assets.each { name, urlString ->
            def destination = new File(drawableDir, name)
            def connection = new URL(urlString).openConnection()
            connection.setRequestProperty('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
            connection.setConnectTimeout(30000)
            connection.setReadTimeout(60000)
            connection.connect()

            if (connection.responseCode != 200) {
                throw new GradleException("Failed to download ${name}: HTTP ${connection.responseCode}")
            }

            connection.inputStream.withCloseable { input ->
                destination.withOutputStream { output ->
                    output << input
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(downloadAssets)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
}
